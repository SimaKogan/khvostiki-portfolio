name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Подставить адрес сайта и адрес API
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}   # необязательно: свой домен
          API_URL: ${{ vars.API_URL }}              # необязательно: https://<проект>.vercel.app/api/apply
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"; REPO="${REPO,,}"
          SITE_URL="${SITE_URL_OVERRIDE:-https://${OWNER}.github.io/${REPO}}"
          SITE_URL="${SITE_URL%/}"
          grep -rIl "__SITE_URL__" site | xargs sed -i "s|__SITE_URL__|${SITE_URL}|g"
          if [ -n "${API_URL}" ]; then
            sed -i "s|data-endpoint=\"\"|data-endpoint=\"${API_URL}\"|" site/index.html
          fi
          echo "SITE_URL=${SITE_URL}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
